[package]
name = "flip7"
version = "0.1.0"
edition = "2021"
description = "Feuille de score Flip 7 pour téléphone"
publish = false

[dependencies]
console_error_panic_hook = "0.1"
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
